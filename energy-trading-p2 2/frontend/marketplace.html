<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace — Smart Energy Trading Platform</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="sidebar">
        <div class="sidebar-brand">
          <span class="dot">⚡</span> Energy Trading
        </div>

        <div class="sidebar-nav">
          <span class="sidebar-section-label">Menu</span>
          <button
            class="sidebar-link"
            onclick="window.location.href = 'dashboard.html'"
          >
            <span class="icon">📊</span> Dashboard
          </button>
          <button class="sidebar-link active">
            <span class="icon">🛒</span> Marketplace
          </button>
        </div>

        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="sidebar-avatar" id="sidebarAvatar">?</div>
            <div class="sidebar-user-info">
              <div class="name" id="sidebarName">—</div>
              <div class="role" id="sidebarMeter">—</div>
            </div>
          </div>
          <button class="sidebar-logout" onclick="logout()">
            <span class="icon">↪</span> Log Out
          </button>
        </div>
      </div>

      <div class="main-content">
        <div class="topbar">
          <div class="topbar-title">Marketplace</div>
        </div>

        <div class="page-content">
          <div class="section-card" style="margin-bottom: 0">
            <div class="section-heading">
              <h1>Energy Marketplace</h1>
              <p class="subtitle">
                Surplus energy posted for sale by other users. Buy what you need
                directly from a seller.
              </p>
            </div>
            <div class="listing-list" id="listingList"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/marketplace.js"></script>
  </body>
</html>
