<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Smart Energy Trading Platform</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-shell">

    <div class="auth-form-panel">
      <div class="card">
        <span class="badge">⚡ Smart Energy Trading Platform</span>
        <h1>Welcome back</h1>
        <p class="subtitle">Enter your account details to access your dashboard</p>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="name@example.com" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" required />
          </div>

          <p id="errorMessage" class="subtitle hidden" style="color:#dc2626"></p>

          <button type="submit" class="btn btn-primary">Log In</button>
        </form>

        <div class="divider"><hr /><span>or</span><hr /></div>

        <button class="btn btn-outline" onclick="window.location.href='signup.html'">
          Create New Account
        </button>

        <p class="subtitle center-text" style="margin-top:20px; margin-bottom:0">
          Are you an admin?
          <button type="button" class="btn-link" onclick="window.location.href='admin-login.html'">Log in here</button>
        </p>
      </div>
    </div>
  </div>

  
  <script src="js/config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault()

      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const errorMessage = document.getElementById('errorMessage')
      errorMessage.classList.add('hidden')

      const response = await fetch(API_URL + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      })

      const data = await response.json()

      if (!response.ok) {
        errorMessage.textContent = data.message
        errorMessage.classList.remove('hidden')
        return
      }

      if (data.role !== 'user') {
        errorMessage.textContent = 'that is an admin account, use the admin login instead'
        errorMessage.classList.remove('hidden')
        return
      }

      localStorage.setItem('user', JSON.stringify(data))
      window.location.href = 'dashboard.html'
    })
  </script>
</body>
</html>
